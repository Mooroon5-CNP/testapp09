name: CNP — testapp09
'on':
  push:
    branches:
      - main
      - prod
  workflow_dispatch: {}
permissions:
  contents: read
  id-token: write
concurrency:
  group: cnp-testapp09-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pipeline:
    uses: Mooroon5-CNP/ci-templates/.github/workflows/pipeline-azure.yml@main
    with:
      app_name: testapp09
      app_port: '8080'
      config_repo_url: https://github.com/Mooroon5-CNP/config-repo
      gitops_mode: portal
    secrets:
      CONFIG_REPO_TOKEN: ${{ secrets.CONFIG_REPO_TOKEN }}
